[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-predator"
version = "0.1.0"
description = "Hunt, devour, isolate, analyse, and update agent skills without losing local edits."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools]
packages = ["skill_predator"]

[project.scripts]
skill-predator = "skill_predator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
